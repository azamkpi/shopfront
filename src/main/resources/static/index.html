<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Do'kon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #fff);
            --text: var(--tg-theme-text-color, #000);
            --hint: var(--tg-theme-hint-color, #999);
            --card: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #fff);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg); color: var(--text);
        }
        .head { padding: 14px 16px 6px; }
        .head h1 { margin: 0; font-size: 19px; font-weight: 600; }
        .head p { margin: 3px 0 0; font-size: 13px; color: var(--hint); }

        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: 0 0 auto; padding: 7px 14px; border-radius: 16px;
            background: var(--card); font-size: 14px; border: none;
            color: var(--text); cursor: pointer; white-space: nowrap;
        }
        .chip.on { background: var(--btn); color: var(--btn-text); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 16px 24px; }
        .card { background: var(--card); border-radius: 14px; overflow: hidden; cursor: pointer; }
        .card .ph { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; background: var(--card); }
        .card .body { padding: 8px 10px 11px; }
        .card .nm {
            font-size: 13px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 53px;
        }
        .card .pr { font-size: 14px; font-weight: 600; margin-top: 5px; }
        .card .neg { font-size: 12px; color: var(--btn); margin-top: 5px; }
        .out { opacity: .45; }

        .empty { text-align: center; padding: 60px 20px; color: var(--hint); font-size: 14px; }

        /* Mahsulot sahifasi */
        .page { position: fixed; inset: 0; background: var(--bg); z-index: 10;
            overflow-y: auto; display: none; }
        .page.on { display: block; }
        .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .slider::-webkit-scrollbar { display: none; }
        .slider img { flex: 0 0 100%; aspect-ratio: 1; object-fit: contain; background: var(--card); }
        .dots { display: flex; justify-content: center; gap: 5px; padding: 8px 0; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hint); opacity: .35; }
        .dot.on { opacity: 1; }
        .detail { padding: 4px 16px 100px; }
        .detail h2 { margin: 6px 0 10px; font-size: 18px; }
        .detail .price { font-size: 22px; font-weight: 700; }
        .detail .desc { margin-top: 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }

        /* Buyurtma formasi */
        .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
        .sheet.on { display: block; }
        .sheet .inner { position: absolute; bottom: 0; left: 0; right: 0;
            background: var(--bg); border-radius: 16px 16px 0 0; padding: 18px 16px 24px; }
        .sheet h3 { margin: 0 0 14px; font-size: 17px; }
        .sheet input, .sheet textarea {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px;
            border: 1px solid var(--card); background: var(--card);
            color: var(--text); font-size: 15px; font-family: inherit;
        }
        .sheet textarea { min-height: 64px; resize: none; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: var(--btn); color: var(--btn-text); font-size: 15px;
            font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: .5; }
        .link { display: block; text-align: center; margin-top: 10px;
            color: var(--hint); font-size: 14px; background: none; border: none; width: 100%; }
        .chips { display: none; }
    </style>
</head>
<body>

<div id="app">
    <div class="head">
        <h1 id="shopTitle">Yuklanmoqda...</h1>
        <p id="shopWelcome"></p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Mahsulot topilmadi</div>
</div>

<div class="page" id="page">
    <div class="slider" id="slider"></div>
    <div class="dots" id="dots"></div>
    <div class="detail">
        <h2 id="pName"></h2>
        <div class="price" id="pPrice"></div>
        <div class="desc" id="pDesc"></div>
    </div>
</div>

<div class="sheet" id="sheet">
    <div class="inner">
        <h3>Buyurtma berish</h3>
        <input id="fName" placeholder="Ismingiz">
        <input id="fPhone" placeholder="Telefon: 901234567" inputmode="tel">
        <textarea id="fNote" placeholder="Izoh (ixtiyoriy)"></textarea>
        <button class="btn" id="fSend">Yuborish</button>
        <button class="link" id="fCancel">Bekor qilish</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let currentCategory = null;
    let currentProduct = null;

    const money = v => v == null ? null
        : new Intl.NumberFormat('uz-UZ').format(v) + " so'm";

    async function api(path, opts) {
        const res = await fetch('/api' + path, opts);
        if (!res.ok) throw new Error((await res.json()).error || 'Xatolik');
        return res.json();
    }

    async function loadShop() {
        const shop = await api('/shop');
        document.getElementById('shopTitle').textContent = shop.title;
        document.getElementById('shopWelcome').textContent = shop.welcomeText || '';

        const chips = document.getElementById('chips');
        chips.innerHTML = '';
        addChip(chips, 'Hammasi', null, true);
        shop.categories.forEach(c => addChip(chips, c.name, c.id, false));
    }

    function addChip(box, label, id, active) {
        const b = document.createElement('button');
        b.className = 'chip' + (active ? ' on' : '');
        b.textContent = label;
        b.onclick = () => {
            document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            currentCategory = id;
            loadProducts();
        };
        box.appendChild(b);
    }

    async function loadProducts() {
        const q = currentCategory ? '?categoryId=' + currentCategory : '';
        const data = await api('/products' + q);
        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');

        grid.innerHTML = '';
        empty.style.display = data.items.length ? 'none' : 'block';

        data.items.forEach(p => {
            const el = document.createElement('div');
            el.className = 'card' + (p.inStock ? '' : ' out');

            let priceHtml;
            if (!p.inStock)          priceHtml = '<div class="neg">Tugagan</div>';
            else if (p.negotiable)   priceHtml = '<div class="neg">Kelishiladi</div>';
            else if (p.price != null) priceHtml = '<div class="pr">' + money(p.price) + '</div>';
            else                     priceHtml = '<div class="neg">Narxni so\'rang</div>';

            el.innerHTML =
                '<img class="ph" src="' + (p.imageUrl || '') + '" loading="lazy" ' +
                'onerror="this.style.visibility=\'hidden\'">' +
                '<div class="body"><div class="nm">' + esc(p.name) + '</div>' + priceHtml + '</div>';

            el.onclick = () => openProduct(p.id);
            grid.appendChild(el);
        });
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    async function openProduct(id) {
        const p = await api('/products/' + id);
        currentProduct = p;

        const slider = document.getElementById('slider');
        const dots = document.getElementById('dots');
        slider.innerHTML = '';
        dots.innerHTML = '';

        p.images.forEach((url, i) => {
            const img = document.createElement('img');
            img.src = url;
            slider.appendChild(img);
            const d = document.createElement('div');
            d.className = 'dot' + (i === 0 ? ' on' : '');
            dots.appendChild(d);
        });

        slider.onscroll = () => {
            const idx = Math.round(slider.scrollLeft / slider.clientWidth);
            [...dots.children].forEach((d, i) => d.classList.toggle('on', i === idx));
        };

        document.getElementById('pName').textContent = p.name;
        document.getElementById('pDesc').textContent = p.description || '';

        const v = p.variants[0];
        const priceBox = document.getElementById('pPrice');
        if (p.negotiable)            priceBox.textContent = 'Kelishiladi';
        else if (v && v.price != null) priceBox.textContent = money(v.price);
        else                          priceBox.textContent = "Narxni so'rang";

        document.getElementById('page').classList.add('on');

        tg.BackButton.show();
        tg.BackButton.onClick(closeProduct);
        tg.MainButton.setText('Buyurtma berish');
        tg.MainButton.show();
        tg.MainButton.onClick(openSheet);
    }

    function closeProduct() {
        document.getElementById('page').classList.remove('on');
        tg.BackButton.hide();
        tg.MainButton.hide();
        currentProduct = null;
    }

    function openSheet() {
        document.getElementById('sheet').classList.add('on');
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (u) {
            const nameInput = document.getElementById('fName');
            if (!nameInput.value) {
                nameInput.value = [u.first_name, u.last_name].filter(Boolean).join(' ');
            }
        }
    }

    document.getElementById('fCancel').onclick = () =>
        document.getElementById('sheet').classList.remove('on');

    document.getElementById('fSend').onclick = async () => {
        const phone = document.getElementById('fPhone').value.trim();
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (phone.length < 7) {
            tg.showAlert('Telefon raqamni to\'liq kiriting');
            return;
        }

        const btn = document.getElementById('fSend');
        btn.disabled = true;

        try {
            await api('/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json',
                    ...(u ? { 'X-Telegram-User-Id': String(u.id) } : {})
                },
                body: JSON.stringify({
                    variantId: currentProduct.variants[0] ? currentProduct.variants[0].id : null,
                    fullName: document.getElementById('fName').value.trim(),
                    phone: phone,
                    note: document.getElementById('fNote').value.trim()
                })
            });

            document.getElementById('sheet').classList.remove('on');
            closeProduct();
            tg.showAlert('Buyurtmangiz qabul qilindi. Tez orada bog\'lanamiz.');
            document.getElementById('fPhone').value = '';
            document.getElementById('fNote').value = '';

        } catch (e) {
            tg.showAlert('Xatolik: ' + e.message);
        } finally {
            btn.disabled = false;
        }
    };

    loadShop().then(loadProducts).catch(e =>
        document.getElementById('shopTitle').textContent = 'Xatolik: ' + e.message
    );
</script>
</body>
</html>
